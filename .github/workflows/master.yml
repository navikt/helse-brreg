name: Bygg og deploy ved push til master

on:
   workflow_dispatch:
   push:
      branches:
         - master

jobs:
   build:
      name: Build and push Docker container
      runs-on: ubuntu-latest
      permissions:
         contents: read
         packages: write
         id-token: write
      steps:
         -  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
         -  uses: ./.github/actions/gradle-build
         -  uses: nais/docker-build-push@v0
            id: docker-push
            with:
               team: risk
      outputs:
         IMAGE: ${{ steps.docker-push.outputs.image }}

   deploy_to_dev_gcp:
      name: Deploy to devGCP
      needs: build
      if: github.ref == 'refs/heads/master'
      runs-on: ubuntu-latest
      permissions:
         id-token: write
         contents: read
      steps:
         -  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
         -  uses: nais/deploy/actions/deploy@v2
            env:
               IMAGE: ${{ needs.build.outputs.IMAGE }}
               CLUSTER: dev-gcp
               RESOURCE: deploy/nais-gcp.yml
               VARS: deploy/dev.yml

   deploy_to_prod_gcp:
      name: Deploy to prodGCP
      needs: build
      if: github.ref == 'refs/heads/master'
      runs-on: ubuntu-latest
      permissions:
         id-token: write
         contents: read
      steps:
         -  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
         -  uses: nais/deploy/actions/deploy@v2
            env:
               IMAGE: ${{ needs.build.outputs.IMAGE }}
               CLUSTER: prod-gcp
               RESOURCE: deploy/nais-gcp.yml
               VARS: deploy/prod.yml
